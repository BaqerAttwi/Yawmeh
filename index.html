    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <!-- The CSP hash must match this script after every edit. The server recalculates it from the built HTML on startup. -->
    <script id="appearance-bootstrap">
      try {
        const {dataset} = document.documentElement;
        const theme = localStorage.getItem('yawmeh:theme');
        const palette = localStorage.getItem('yawmeh.palette');
        if (theme === 'light' || theme === 'dark') dataset.theme = theme;
        if (['ocean', 'coral', 'emerald'].includes(palette)) dataset.palette = palette;
      } catch {}
    </script>
    <style>
      html {color-scheme:light dark;background:light-dark(__BRAND_LIGHT_BG__,__BRAND_DARK_BG__)}
      html[data-theme="light"] {color-scheme:light}
      html[data-theme="dark"] {color-scheme:dark}
    </style>
